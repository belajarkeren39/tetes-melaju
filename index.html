<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tetes Melaju — Anime Grand Prix · Balap Motor 1–4 Pemain</title>
<style>
:root{--navy:#0B3D6B;--blue:#1E88E5;--sun:#FFD54F;--green:#2E9E4F;--cloud:#F4FBFF;--coral:#FF7043;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#06223d;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--navy)!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#9fd8ff;color:var(--navy);font-size:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#arena{position:absolute;inset:0}
#cv{width:100%;height:100%;display:block}
#toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);pointer-events:none;font-weight:900;font-size:2em;padding:.35em .9em;border-radius:1em;background:#fff;color:var(--navy);border:.15em solid var(--navy);display:none;text-align:center;z-index:7;max-width:90%}
#toast.ok{background:#d9f7e3;border-color:#1f7a3a;color:#14572a}
#toast.bad{background:#ffe3dc;border-color:#b23a1b;color:#7a2410}
#toast.show{display:block}
/* HUD */
#hud{display:none;position:absolute;top:0;left:0;right:0;height:max(3.5em,56px);align-items:center;gap:.9em;padding:0 1em;background:rgba(11,61,107,.9);color:#fff;font-weight:700;z-index:5}
#stage.playing #hud{display:flex}
#hud .grow{flex:1}
.hbtn{min-height:44px;min-width:56px;border:0;border-radius:.8em;background:#fff;color:var(--navy);font-weight:800;padding:0 .9em}
#hLives{display:flex;gap:.25em;align-items:center}
#hLives svg{width:1.5em;height:1.5em}
#hZone{opacity:.9;font-weight:600;font-size:.9em}
